            <h2>Fundamental Rights</h2> 
            <p>
		The broad spectrum of rights or human rights from which fundamental rights are drawn are universal and inalienable—applicable to all persons irrespective of nationality. 		They are rights which in and of itself are derivable from Natural Law or Natural Justice as one may have it.
		Within the international scene, the atrocities of World War II had an impact on the development of human rights, as it became apparent that national mechanisms for 			protection were inadequate. And from this was the Universal Declaration of Human Rights engendered in 1948; along with various other frameworks and structures put in place 		by the United Nations to ensure that certain minimum rights were protected and regarded as fundamental, and inalienable.
		</br>
		According to <span class= "case-law">Salmond</span>, a right is an interest, respect for which is a duty and the disregard of which is a wrong. He identifies 4 types of 		rights in a wider sense as rights, powers, liberties and immunities.
		What then makes human rights fundamental?
		In the broad sense of the word—although inconclusive—the conception of what human rights are, are inclusive of civil, political, economic, social and cultural rights. Some 		of which are typically non-justiciable within the 1999 Constitution. The court in <span class= "case-law">UZOUKWU V. EZENU II </span> makes a clear distinction between 		Human Rights and Fundamental Rights when it held thus:
		<blockquote>
		“What is entrenched in Chapter IV of the Constitution is 'fundamental rights'... It may be recalled that human rights were derived from and out of the wider 				concept of natural rights. They are rights which every civilized society must accept as belonging to each person as a human being. These were termed human rights... 			Fundamental rights remain in the realm of domestic law. They are fundamental because they have been guaranteed by the fundamental law of the country; that is by the 			Constitution.” 
		</blockquote>

	    </p>
		<p>
		Consequently, when the UN made its declaration it was in respect to human rights as it was envisaged that certain rights belong to all humans irrespective of citizenship, 		race, religion and so on. However, there is no consensus as regards to the finite nature of these rights, that is why many nations (Nigeria inclusive) decided to prioritize 		the most important of such rights guaranteed within Sections 33-44 CFRN as Fundamental Rights.</p>
		<p>Fundamental rights, have also been beautifully described in the words of <span class= "case-law"> Eso JSC in RANSOME KUTI V. ATTORNEY GENERAL OF THE FEDERATION as:</span>
		<blockquote>  “...a right which stands above the ordinary laws of the land and which in fact is antecedent to the political society itself. It is the primary condition to a 		civilized existence and what has been done by our constitution... is to have these rights enshrined in the constitution so that the rights could be 'immutable to the extent 		of the non-immutability of the constitution itself'.” </blockquote>
		</p>
		
		<p>It bears noting that, the idea of fundamental rights has a "growing content". What this means is that new rights are constantly being interpreted into existing rights 		and some formerly thought to be not so important being elevated to greater heights. For instance in the case of <span class= "case-law">OKONKWO V. MDPDT, the court 			interpreted the right to object 		to medical treatment as being an off-shoot of the right to privacy and the right to freedom of thought, conscience and 			religion as enshrined in sections 37 and 38 of the 		1999 Constitution respectively.</span></p>

		We shall now examine each of these rights:
		

		<h3>RIGHT TO LIFE: SECTION 33</h3>
		<p>Life is sacralized; the right to life suggests that unless for justifiable reasons, no person shall be deprived of their life. This right falls within such rights that 		apply to all persons—aliens and citizens alike. Thus in BELLO v. A-G OYO (1986) 5 NWLR (Pt. 45) 828, the court held that the content of life imposes a positive duty on the 		government and authorities to protect life and create a conducive environment for the security of life. It is in view of this that it has been argued that the right to life 		is so significant that one cannot enjoy such other rights, if there was no life. Hence, the right to life implicitly includes the availability of such conditions that life 		could thrive. Anything that affects the quality of life affects life itself.<br>
		The learned Author <span class="case-law">Kehinde M. Mowoe</span> contends that: 
		<blockquote> "Quality of life is however difficult to define because it is subjective and changes with time. However, its measurement 		centres on economic and 		social factors and its quality depends on the economic ability of a nation, and the priority and awareness of the people. Thus considerations such 		as 			education, shelter, health, environmental factors, work and so on are important to its determination".
		</blockquote>
		<p>Succinctly put; <span class="case-law"><u>S. 33(1) provides that: every person shall enjoy right to life, and no person shall be deprived of such right intentionally, save 		in 		execution of sentence of 		court in respect to criminal offence for which he has been found guilty.</u></span>
		<br>
		Consequently, <span class= "case-law">S. 33</span> contemplates that there are certain circumstances for which deprivation of life may be either tolerated or justified and 		in subsection <span class= "case-law">1</span> they include:</p>
		<ol>
		<li>	<p>Unintentional deprivation of life; In cases where such occurs by accident or independently of the exercise of one's will. In cases of such nature the law may 			consider the death of another a misadventure. This is the position of law as contemplated by <span class= "case-law">Section 24 of the Criminal Code</span>. The absence of intention or negligence 			exculpates a defendant where he takes the life of another by accident.</p>
		</li>
		<li>	<p>In execution of sentence: The court in KALU v. STATE (1998) 13 NWLR, 583 held in favour of the Death penalty. Despite the raging controversy around the topic of the 		death penalty, the disposition of courts of law has always been to uphold the constitutionality of the death sentence by imposing it on crimes like Murder, armed robbery, 		treason etc.</p></li></ol>
		<p>In the same vein the court has also advocated against any unjustified deprivation of a person's life by extrajudicial means. In the case of <span class= "case-law">Bello v. A.G Oyo<u>,the court 			frowned at the execution of a death sentence without allowing the defendant the opportunity to exhaust their right of appeal.</u></span>
		<br>
		Furthermore, <span class="case-law">S. 33(2) provides that <u>a person shall not be regarded as having been deprived of his life in contravention of this section, if he dies as a result of the use, 		to such extent and in such circumstances as are permitted by law, of such force reasonably necessary- </u></span></p>

<span class="case-law"><ol>
<li> for the defence of any person from unlawful violence or for the defence of property;</li>
<li> in order to effect lawful arrest or to prevent the escape of a person lawfully detained; or</li>
<li> for the purpose of suppressing riot, insurrection or mutiny.</li> </ol></span></p>
<p>In view of <span class= "case-law">S. 33(2)</span> the law permits the exertion of reasonable force if it is for the purpose of protecting a person or property. However, such force must be proportional to the threat. For instance, if a person is being attacked with a stick, he cannot use a gun to defend himself, as that would be considered excessive force.</p>
<p>Furthermore, the law also permits the use of force to prevent the escape of a person who has been lawfully detained or arrested. This is to ensure that justice is served and the law is upheld. Whenever any person commits an offence in the presence of a policeman, he can be arrested irrespective of the requirement of law creating the offence.
If the offence is punishable by death or not less than 7 years imprisonment, the officer may kill in the process of effecting arrest if there is no other means of arresting the offender.
It should also be noted that the law frowns at the Extra-judicial killings; Mercy killing <span class= "case-law">(DANLADI V. STATE [2025])</span>; suicide; Assisted suicide etc.

Lastly, the law also permits the use of force for the purpose of suppressing riot, insurrection or mutiny. This is to ensure that there is peace and order in the society.
		</p>
		

		<h3>RIGHT TO DIGNITY OF HUMAN PERSON:</h3> 
		<p><span class= "case-law">Section 34(1) provides that every individual is entitled to respect for the dignity of his person, and 			accordingly—<br>
		(a) no person shall be subjected to torture or to inhuman or degrading treatment;<br>
		(b) no person shall be held in slavery or servitude; and<br>
		(c) no person shall be required to perform forced or compulsory labour.<br></span>
		The Right to dignity suggests that all persons shall be treated humanely and with respect. And that no person shall be denigrated or held in 		servitude against their will. The universal concept of equality no doubt compels the respect for certain minimum standards or factors in the 		attainment of this dignity.<br>

		The hallmark of the entire provisions of <span class= "case-law">S. 34</span> is that no person shall be subject to torture or to inhuman or 		degrading treatment. Thus, the 		court in <span class= "case-law">CATHOLIC COMMISSION FOR JUSTICE AND PEACE ZIMBABWE v. ATTORNEY 		GENERAL</span> considered keeping prisoners on death row awaiting execution for a prolonged period, inhumane and degrading. In the same vein 		advocates for the proscription of death sentences have made arguments against the execution of humans for whatever reason.
		But the court in <span class= "case-law">JOSHUA V. STATE (2009) ALL FWLR (Pt. 475) 1626</span> held per Denton-West JCA that;
		<blockquote>"even though I share the sentiments of the appellant in respect of their submission pertaining to the scrapping of death   			sentence as arbitrary, inhuman, and degrading and that no man except God in my view, has the right to take life, the Nigerian law is so 		clear on the issue and needs to be properly orchestrated in the right forum like the National Assembly..."</blockquote>


		This section also protects a suspect from torture by security officers particularly in their arrest and investigation. This provision has 		informed the enactment of the <span class="case-law">Anti-Torture Act</span>, it has also been included in <span class="case-law">Section 8 		of the Administration of Criminal Justice Act (ACJA).</span>
		<span class="case-law">SECTION 34 (1) C</span> prohibits forced labour, but it however, stated that forced labour under the contemplation of 		this section does not 			include:
		<ul>
		<span class="case-law">
		<li>Labour done in consequence of a court sentence;</li>
		<li>Labour required of members of armed forces in exercise of their duties;</li>
		<li>Labour required in cases of emergency;</li>
		<li>Or any labour required for communal service or for compulsory national service which may be introduced by an Act of the National 			Assembly.</li>
		</span>
		</ul>
		The court in <span class="case-law">UZOUKWU V. EZEONU II (1991) 6 NWLR (pt. 200) 708 Per Niki Tobi JCA</span> defined the terms used in 		<span class="case-law">S. 31 of the 1979 Constitution (now S. 34 of the 1999 Constitution)</span>. He held torture to mean; 			 	<blockquote> “putting a person to some form of pain which could be extreme. It means to put 	a person to some form of anguish or 			excessive pain... It covers a situation where a person's mental orientation is very much disturbed and he cannot think and do things 			rationally, as a rational human being that he is.”</blockquote>
		Similarly, the court held that; 
		<blockquote>"forced or compulsory labour is a labour which the person has not the physical power or strength to opt out. It is a labour 		which the person must perform whether he likes it or not. In the context of Section 31(1)—now 34(1)—the individual has no choice than to 		perform the labour.”
		</blockquote>
		</p>

		<h3>PERSONAL LIBERTY:</h3>
		<p>This right is provided for under <span class= "case-law">Section 35 of the 1999 Constitution.</span>
		 Personal liberty is the freedom of every person to do what they will. Lord Denning (Freedom under the Law, 1949) defined personal liberty 		as <span class= "case-law">"the freedom of every law-abiding citizen to think what he will, to say what he will on his lawful occasion 			without let or hindrance from any other person."</span> Contextually, <span class= "case-law">S. 35</span> protects persons against unlawful 		arrest, detention or confinement.
		<p>In <span class= "case-law">LIVERSIDGE v. ANDERSON</span>, Lord Atkin opined that: <span class= "case-law">"In English law every imprisonment 		is prima facie unlawful and that it is for the person directing the imprisonment to justify it."</span> Thus the right to person liberty is 		encumbered by certain exceptions:
		<ul>
	  	<li>Acting contrary to law or court order may lead to an arrest, detention or confinement.</li>
		<li>Execution of court sentence</li>
		<li>In protection of public safety</li>
		<li>For the purpose of education and welfare of a person who has not attained the age of 18.</li>
		<li>Detention for medical purposes <span class= "case-law">— OKORO v. NCDC (2025) LPELR — 80676 (CA)<span></li>
		<li>For the purpose of preventing unlawful entry, for the expulsion or removal of persons from Nigeria.</li>
		</ul></p>
		<p><span class= "case-law">Subsection 2</span> provides that any person arrested or detained has the right to remain silent and refuse to answer any question until he has consulted his legal practitioner or any other person of his choice. In <span class= "case-law">AWOLOWO v. MIN. OF INTERNAL AFFAIRS</span> the court construed the provision for legal practitioner of choice to be restricted to legal practitioners in Nigeria.<span class= "case-law">S. 35(3)-</span> Informed of offence within 24 hours in language the detainee understands.</p>
		<p><span class= "case-law">S. 35(4)—</span>provides that where one is arrested or detained he must be tried within a reasonable time of such arrest or detention or released on bail to ensure that he appears for trial on a future date. <br>It must be noted that the grant of bail, where the offence is bailable is subject to judicial discretion and other relevant conditions like the health condition of the offender, the nature of the crime and the propensity to reoffend or obstruct investigation <span class= "case-law">(See BAMAIYI v. STATE (2001) 2 NWLR (Pt. 698) 435)</span> <span class= "case-law">Section 35(6)</span> Any person unlawfully detained is entitled to compensation and public apology. <span class= "case-law">See: Dele Giwa v. IGP.</span>
</p>

<h3>FAIR HEARING:</h3>
<p>The right to fair hearing is encapsulated in Section 36 of the Constitution. The key pillars of the principles of fair hearing are entwined <span class= "case-law">IMPARTIALITY AND FAIRNESS.</span>
<p>In <span class= "case-law">KANDA v. GOVT OF MALAYA, Denning J analysed the two key principles thus:</span>
<blockquote>
"The rule against bias is one thing, the right to be heard is another. These two rules are the essential characteristics of what is often called Natural Justice. They are the two pillars supporting it, the Romans put them in two Maxims: Nemo judex in causa sua and Audi Alteram partem. They have recently been put in two words, Impartiality and Fairness. But they are different concepts and are governed by different considerations."
<br>
Thus, the principle of fair hearing is embedded in the two pillars of Natural Justice: Audi Alteram partem (hear both sides) and Nemo judex in causa sua (no one shall be a judge in his own case).</blockquote>
</p>
<p>In <span class= "case-law">GARBA V. UNIVERSITY OF MAIDUGURI, Oputa JSC opined that: <u>“fair hearing implies much more than hearing the appellants testify before the Disciplinary Investigation panel... to constitute fair hearing whether it be before the regular courts or before tribunals and Board of inquiry the person accused should know what is alleged against him; he should be present when evidence against him is tendered and he should be given a fair opportunity to correct or contradict such evidence.”</u></span>
<br>The doctrine has further been upheld in a plethora of cases including: <span class= "case-law">GANI v. LPDC; AGBAKO v. WAEC; DENLOYE v. MPDT</span>
It follows therefore that the burden of proving the breach of fair hearing is on the person alleging the breach and they must prove that in light of the case. <br>However, in order to give clarity one could suggest that fair hearing is giving equal opportunity to parties to be heard. Where parties have been given such opportunity and they fail to exercise their right, the party cannot plead breach of fair hearing — see: <span class= "case-law">FRN V. EZE (2017)</span></p>
<p>In <span class= "case-law">MILITARY GOVERNOR OF IMO STATE v. NWAUWA (1997) 2 NWLR (Pt. 490) 675,</span> the court held that the right to fair hearing is a fundamental right. It is a right which can only be waived by a party for whose benefit it exists. The right to fair hearing is a right of substance and not of form. The question is not whether any injustice has been done because of the lack of hearing. It is whether a party entitled to be heard before a deciding body has in fact been given the opportunity of being heard.
<br>
If a person is charged with a criminal offence, the right of such a person as entrenched in <span class= "case-law">section 36(4)</span> — Unless the charge is withdrawn — is a right to:
<ul>
<li>fair hearing;</li>
<li>	 within a reasonable time;</li>
<li>	 by a court or tribunal;</li>
<li>	 constituted in such a manner as to secure its independence and impartiality.</li>
</ul>
</p>
<p>Consequently fair hearing connotes the right to be heard by an unbiased tribunal, and in open court, save in some exceptional cases where the law requires the case heard outside of public glare. For example in a case of Juvenile offences and in cases where the court requires that certain privileged documents be examined in camera, due to public policy concerns. The principle of public trial is in tandem with the common law principle of <span class= "case-law">OPENNESS OF COURT. Lord Shaw restating this principle in SCOTT V. SCOTT averred that:
 <u>"In the darkness of secrecy, sinister interest and evil in all shapes, have full swing... Where there is no publicity there is no justice."</u></span>
</p>
<p><span class= "case-law">S. 36(5)</span> of the Constitution provides that a person charged with a crime must be presumed innocent until the contrary is proved. Thus, the onus lies with the prosecution to prove beyond reasonable doubt the crime levied against the defendant.
Speaking on <span class= "case-law"><u>"beyond reasonable doubt"</u></span> it should be noted that beyond reasonable doubt does not in fact mean proof beyond a shadow of doubt. — <span class= "case-law">see: Miller v. Minister of Pensions [1947] 2 All ER 372</span>
It follows from the foregoing that, it is not in the position of the defendant to prove their innocence, save in exceptional circumstance.</p>

<p><span class= "case-law">FAIR TRIAL: Section 36 (6) CFRN</span>
<span class= "case-law">S. 36 (6) (A)</span> provides that the defendant shall be informed in language one understands the nature of the offence they are being charged with.
<br>
<span class= "case-law">Subsection(6)(B)</span> provides that the defendant must be given adequate time and facility to prepare defense. The subsection also emphasizes the need for quick dispensation of justice.</br>
<span class= "case-law">Subsection(6)(C)</span> The defendant shall be entitled to defend themselves or through any legal practitioner of choice.
Subsection 6 (d) provides that the defence shall be entitled to examine witnesses and subsection 6 (e) provides for an interpreter where necessary.<br>

<span class= "case-law">Section 36 (7)</span> provides for the keeping of records of proceeding.<br>
<span class= "case-law">Section 36 (8)</span> prohibits the enactment of retrospective legislation in criminal law and imposition of higher sentence than what is stipulated for the offense.<br>
<span class= "case-law">Section 36 (9)</span> provides that a person shall not be charged again for the same offence with the same facts as those he had previously convicted or acquitted. This is the common law principle against double jeopardy.
In order to decide whether the accused is being charged and tried twice for the same offence we have to find out whether the same evidence is required to sustain the same conviction.<br>
<span class= "case-law">Subsection (10)</span> extends the rule against double jeopardy to where the accused has not been acquitted or convicted but pardoned.<br>
<span class= "case-law">Section 36(11)</span> provides that a person who is tried for a criminal offence shall not be compelled to give evidence at the trial.<br>
<span class= "case-law">S. 36(12)</span> of the constitution provides that no one can be punished for a criminal offense unless the offence is defined and the penalty for it provided in a written law. In <span class= "case-law">AOKO v. FAGBEMI</span> the court restated this legal principle, reverberating the principle stated in <span class= "case-law">S. 36(12)</span>.
</p>
<p> In this case the applicant was convicted for committing adultery by living with another man without judicial separation in the customary court. The conviction was quashed by the high court and it was held that the applicant had violated no written law and thus her conviction was contrary to the constitution.
The said provision does not prohibit the court from sanctioning contempt—which is not defined in a written law and penalty thereto prescribed.

</p>
<h3>RIGHT TO PRIVATE AND FAMILY LIFE</h3>
<p> <p><span class="case-law">Section 37 CFRN</span> provides that the privacy of citizens, their homes, correspondences, telephone conversation and telegraphic communications are protected and guaranteed.<br>
The rationale for incorporating the right to private and family life into the constitution is to give adequate protection to the personal affairs of the individual.
This right has been interpreted in the case of MDPDT V. OKONKWO to include the right of an adult to decide the kind of medical treatment that could be administered on him.<br>
<span class="case-law">AYOOLA Jsc said:<br>
 <blockquote><u>The right to privacy implies a right to protect one's thought conscience or religious belief and practice from coercive and unjustified intrusion and one's body from unauthorized invasion. The limits of these freedoms, as in all cases, are where they impinge on the rights of others or where they put the welfare of the society or public health in jeopardy. The sum total of the rights of privacy and of freedom of thought, conscience and religion which an individual has, put in a nutshell, is that an individual should be left alone to choose a course for his life, unless a clear and compelling overriding state interest justifies the contrary."</u>
</blockquote></span>
</p>

<h3>THE RIGHT TO FREEDOM OF THOUGHT, CONSCIENCE AND RELIGION: SECTION 38 CFRN.</h3>
<p>By virtue of <span class="case-law">S. 38(1) and (2)</span> of the constitution every person shall be entitled to freedom of thought conscience and religion, including freedom to change his religion or belief and freedom, either alone or in community with others and in public or in private, to MANIFEST, and PROPAGATE his religion or belief in worship, teaching, practice and observance.<br>
No person attending any place of education shall be required to receive religious instruction or take part in or attend any religious ceremony or observance if such instruction, ceremony or observance relate to a religion other than his own or a religion not approved by his parents or guardian. No religious community or denomination shall be prevented from providing religious instruction for pupils of that community or denomination in any place of education maintained wholly by the community or denomination. <br>Nothing in the Section shall entitle a person to form, take part or be a member of a secret society.
The principles outlined in <span class="case-law">Section 38</span> have been interpreted and espoused by the court in a myriad of decided cases including:
<center><blockquote>— INCORP. TRUSTEES, CAN V. KWARA STATE GOVT (2020) 13 NWLR<br>
— ESABUNOR V. FAWEYA (2008) 12 NWLR<br>-
— ABDULKAREEM V. LAGOS STATE GOVT (2022) 17 NWLR.</blockquote></center>

<p>This right summarily permits a person or in conjunction as a community to believe, adhere to any form of religion or none to practise and abstain from practicing religious beliefs and to be free from governmental interference with or promotion of religion.
<span class="case-law"><u>“The plain and ordinary grammatical meaning of S. 38(1) of the constitution is that every person is entitled to freedom of thought, conscience and religion — to manifest, practice, observe and propagate one's religious belief. Subsections and the further affirm the protection of those rights.” </u>See: ABDULKAREEM V. LSG (supra)</span>
<br>
See Also <span class="case-law">WEST VIRGINIA EDUCATION BOARD V. BARNETTE <u>where the US supreme court ruled that public schools cannot force students to salute the American flag or recite the pledge of allegiance.</u></span>
The plaintiffs had contended that their refusal to salute the American Flag was because their religion forbade worshipping "graven images.”</p>

<h3>FREEDOM OF EXPRESSION AND THE PRESS.</h3>
<p>This is provided for by <span class= "case-law">section 39 of the 1999 constitution.</span>
<br>
Press freedom has been defined by <span class= "case-law">PROF. BEN NWABUEZE</span> as the right of every person to own a printing press to publish what information or ideas he pleases, to decide the editorial policy of the publication and to enforce it upon his staff and to distribute or circulate it freely without having to obtain a licence from the authorities or to face suppression or proscription.<br>
<span class= "case-law">S. 39(1)</span> of the constitution provides that every person shall be entitled to freedom of expression including freedom to hold opinions and to receive and impart ideas and information without interference. The Section went on in <span class= "case-law">subsection (2)</span> to provide that an individual is also free to own, establish and operate any medium, not being a television or wireless broadcasting station, for the dissemination of such opinions and ideas, except such a person is authorized to establish a wireless or television broadcasting station by the federal Government.<br>
The question of whether the phrase "any medium for the dissemination of information, ideas and opinions" would also include the establishment of private schools and higher institutions was settled in the case of<span class= "case-law"> UKAEGBU V. ATTORNEY GENERAL OF IMO STATE </span>and also in <span class= "case-law">OKOGIE V. ATTORNEY GENERAL OF LAGOS STATE. In OKOGIE V. A.G LAGOS STATE</span> it was held that <span class= "case-law">S. 36(2) of the 1979 Constitution</span> guaranteed the right to establish any medium for the dissemination of information, ideas and opinions and this includes information, ideas, knowledge and opinions.
<span class= "case-law">S. 39(3) CFRN</span> accords a journalist the immunity of being compelled to disclose the source of his information. But this privilege is not absolute.</p>

<h3>RIGHT TO PEACEFUL ASSEMBLY AND ASSOCIATION</h3>
<p>The right to freedom of Assembly and Association is guaranteed under Section 40 of the 1999 constitution.
The Section provides that:
<blockquote><p>Every person shall be entitled to assemble freely and associate with others persons, and in particular he may form or belong to any political party, trade union or any other association for the protection of his interests;
provided that the provisions of this section shall not derogate from the powers conferred by this constitution on the Independent National Electoral commission with respect to political parties to which that commission does not accord recognition.</p></blockquote>
<p>This section guarantees the rights to peaceful assembly and the right to associate freely as one choses. The provisions of this section have been interpreted to also mean the right to protest without the need for obtaining a permit from the police. The scope of this freedom extends only to peaceful assembly, Therefore, this right does not give any person the right to incite violence, riot or disturb the peace.
<span class="case-law">See: IGP V. ANPP</span><br>
Furthermore, <span class="case-law">S. 40</span> also guarantees the right to form and belong to trade unions, clubs, religious associations and political parties. However the right to assemble freely is subject to certain limitations.
In <span class="case-law">OSAWE V. REGISTRAR OF TRADE UNIONS (1985) 1 NWLR the court per OBASEKI JSC <u>stated that the right to freedom of Association is made subject to its being in consonance with any law that is reasonably justifiable in any democratic society, in the interest of defence, public safety, public order, public morality, or public health; and for the purpose of protecting the rights and freedoms of others.</u></span></p>


<h3>RIGHT TO FREEDOM OF MOVEMENT</h3>
<p> <span class= "case-law">S. 41 of the 1999 Constitution</span> gives every citizen the right to move freely within Nigeria and to reside in any part of the country. Thus, no Nigeria citizen shall be expelled, denied entry thereto or exit from any part of Nigeria without due cause or lawful justification.
Attached to this right, is the right to own an international passport which enables one to fully exercise this right. However, UWAIS JSC in DSS v. OLISA <span class= "case-law">AGBAKOBA (1999) held that <u>"The right to have freedom of movement and the freedom to travel outside Nigeria is guaranteed by the constitution, but the right to hold a passport is subject to the provisions of the Act."</u></span>
It must also be noted that the right of movement of a person facing criminal charges may be restricted pending the determination of the case.
The right may also be curtailed during moments of Emergency; through imposition of curfews and other necessary restrictions aimed at ensuring public health, National security and order.</p>


<h3>RIGHT TO FREEDOM FROM DISCRIMINATION</h3>
<p>By virtue of the express provision of <span class= "case-law">Section 42 of the constitution</span> a citizen of Nigeria regardless of sex, circumstance of birth, ethnic group, religion, place of origin and political opinion, shall not by reason only that he is such a person face any form of discrimination as outlined under the said section.<br>
In <span class= "case-law">UZOUKWU V. EZEONU</span> the CA held that the phrase circumstance of birth is not limited to the issue of birth out of lawful wedlock, but covers the issue of descent arising from slavery.<br>
To be entitled to the protection of <span class= "case-law">S. 42(2)</span> the plaintiff must prove the circumstances of his birth and the disability or deprivation suffered as a result.
In a 2023 landmark ruling, the NICN ordered the reinstatement of Corporal Omolola Olajide and invalidated Regulation 127 of the Nigeria police Regulation. <u>The court found that dismissing her for becoming pregnant while unmarried was discriminatory, unconstitutional, and violated her rights, while upholding the illegality of the now expunged provision.</u><br>
Furthermore, the court has by giving effect to <span class= "case-law">section 42</span> declared many customs as discriminatory on grounds that they disinherit the female gender. <span class= "case-law">In UKEJE v. UKEJE</span> for example the CA had to consider the Igbo Native law and custom which disentitled a female from sharing out of her deceased fathers estate.<br>
<span class= "case-law">S. 42(3)</span> state that notwithstanding subsection 1 a law may impose restrictions with respect to the appointment of any person to any office under the state or as a member of the armed forces of the federation or a member of the Nigeria police force or to an office in the service of a body corporate established directly by any law in force in Nigeria.<br>
<span class= "case-law">Section 43</span> guarantees the right to acquire and own immovable property anywhere in Nigeria.
It must be noted that practically, the provisions of <span class= "case-law">S. 43</span> are subject to the customary land tenure and the Land Use Act of Nigeria.<br>

<span class= "case-law">Section 45 of the 1999 constitution</span> outlines certain circumstances that may lead to the derogation from certain provisions in the fundamental right.
It is trite law that the fundamental rights provided by the constitutions in <span class= "case-law">sections 37, 38, 39, 40, 41</span> and indeed all other rights are not absolute.
<span class= "case-law">S. 42 (2) CFRN</span> provides that nothing in the chapter shall prevent the use of measures reasonably justifiable for the purpose of dealing with the situation that exists during periods of emergency.<br>
Illustrating these exceptions, the court has consistently been of the view that where there is the breakdown of order or the likelihood, the rights and privileges of persons involved may be limited in the interest of National security and (or) public interests.
Thus, where it is reasonably justifiable the law permits for the limitation of certain rights <span class= "case-law"><u>in the interest of Defence, public safety, public order, public morality or public health; or for the purpose of protecting the rights and freedom of other persons.</u></span>
In the case of <span class= "case-law">AMAKA OKORO V. NIGERIA CENTRE FOR DISEASE CONTROL (NCDC) & ORS (2025) the court of appeal, addressed the legality of state actions taken during the covid-19 pandemic, <u>reinforcing the principle that fundamental rights can be legally derogated from in the interest of public health.</u></span>
The court per <span class= "case-law">LATEEF ADEBAYO J.C.A held:</span>
<blockquote>
"Without mincing words, outbreak of Covid-19 was a threat to the whole world and globally formidable steps were taken to isolate whoever is inflicted with the deadly disease which is contagious and required to be nipped in the bud, in order to eliminate its widespread across the globe. Therefore, whatever legitimate measure put in place to ensure that a patient suffering from this disease is prevented from intermingling with the populace cannot be considered as a violation of the suspected patient's fundamental right.”</blockquote></p>

<h2>ENFORCEMENT OF FUNDAMENTAL RIGHTS AND LEGAL AID</h2>
<p><span class= "case-law">SECTION 46(1) of the constitution</span> provides that any person who alleges that any right in this chapter has been, is being or likely to be contravened in any state in any state in relation to him may apply to a High court in that state for redress.<br>
There have however been discrepancies in opinion as to what the phrase "High court in that state" means as regards to what court and under what circumstance a High court of either state or Federation has the jurisdiction to entertain disputes evolving from contravention of fundamental right.
The court in <span class= "case-law">JACK v. UNAM (2004)</span> stated that: <span class= "case-law"><u>"By virtue of Order 1 rule 2 of the Fundamental Rights (Enforcement procedure) Rules made pursuant to 1979 constitution, a court is defined as the Federal High court or the Higher court of the state."</u></span><br>
The court in the aforestated case further opined that:
<blockquote>
"Both the Federal High court and High court of a state have concurrent jurisdiction in matters of the enforcement of a person's fundamental right."
Furthermore, the Supreme in FUT MINNA v. OLUTAYO clarified that you must consider the subject matter and the parties involved. For instance, if the breach is related to matters under S. 251 of the constitution, the FHC is often the appropriate forum. But, where the matter is purely between private individuals, or involves a state government Agency, the state High court is the standard choice.</blockquote>

<p><span class= "case-law">S. 46 (3) empowers the Chief Justice of Nigeria</span> to make rules with respect to the practice and procedure of a High court for the purposes of this Section. That is rules for the enforcement of fundamental rights. This section informs the enactment of the <span class= "case-law">Fundamental Rights (Enforcement Procedure) Rules 2009.</span>
<span class= "case-law">Section 46(4) CFRN</span> provides for the National Assembly to make laws as may be necessary to expand the jurisdiction of the High court as they relate to the enforcement of rights. And providing financial aid to Indigent citizens whose rights are infringed. It ensures legal assistance is available for prosecuting rights violations, enhancing access to justice.</p>
