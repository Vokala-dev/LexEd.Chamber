            <h2>LOCAL GOVERNMENT ADMINISTRATION IN NIGERIA </h2> 
            <p><span class= “case-law”>Section 7</span> provides for the existence of democratically elected Local Government councils, with their specific duties, functions, and responsibilities largely spelt out in the Fourth Schedule of the same Constitution. These functions include economic development planning, tax collection, and public service provision.<br> 
<span class= "case-law">According to the Local Government Reforms 1976—a landmark, military-led restructuring that established a uniform, three-tiered federal system—Local Government is <u>“a government at the local level which is exercised through representative councils established by law to exercise power within defined areas to have substantial control over local affairs as well as the staff, institutional and financial powers to initiate and direct the provision of services... And to ensure that local initiative and response to local needs and conditions are maximized.”</span></u></p>
<span class= "case-law">Section 7(1) of the 1999 Constitution of the Federal Republic of Nigeria,</span> reads that: 
<blockquote><span class= "case-law"> <u>“The system of local government by democratically elected local government councils is under this Constitution guaranteed; and accordingly, the Government of every State shall, subject to section 8 of this Constitution, ensure their existence under a Law which provides for the establishment, structure, composition, finance, and functions of such councils.”</u></span></blockquote>
<p>Hence, after the State House of Assembly passed a bill to create a new Local Government by virtue of <span class= "case-law">section 8(3)</span>, a return is made to the National Assembly, for the purpose of ratifying the decision of the state houses of assembly as provided for under <span class= "case-law">Section 8(5) of the Constitution.</span> In essence, although the State House of Assembly can validly create a new local government, the local government will lack the requisite recognition under law unless the provisions of<span class= "case-law">Section 8(5)</span> is perfected.</p>
<p>The Local Government by virtue of it being a creation of the Federal and State government is laden by interference from all the two arms of government.<br>
The federal government, for instance, exercises a degree of control over the local governments in aspects like funding. This is done through the Federal Account Allocation Committee (FAAC) which is responsible for the distribution of revenue to the three tiers of Government.<br>
The Federal Government is also responsible for regulating the structures of the local governments, while the state government is responsible for overseeing the administration of the local governments.</p>

<h2>THE FEDERAL GOVERNMENT AND STATE GOVERNMENT CONTENTION ON LOCAL GOVERNMENT ADMINISTRATION:</h2>
<p>The State Government believes they should be in charge of the revenues generated by the local governments within its territory, while the Federal Government believes proceeds are to be shared equally among states. The Federal Government often plays a supervisory role over the local government areas, while the state government is of the view that they should have the complete control of the local governments within its jurisdictions.<br>
Furthermore, the State governments believe they should have the power to appoint Local government officials while the Federal Government oversees the transparency of the process.
Another point of contention is regards to the administrative and Financial Autonomy of the local governments.<br>
While it is an undisputed reality that the state house of Assembly is by virtue of <span class= "case-law">The Supreme Court decision in A.G. Lagos State v. A.G. Federation (2003) and A.G. Abia State v. A.G. Federation (2006) </span>which confirmed that State Houses of Assembly have the authority to make laws for the structure, finance, and functions of local governments. By enacting laws that are binding all local governments within it, the local governments have also been declared an autonomous and independent tier of government; free to carry out its duties without undue interference from the state government, especially the Governors. </p>
<p>In light of foregoing, the position of the law in <span class= "case-law">Governor of Akwa Ibom v. Umah </span>confers such duties on the State House of Assembly, by stating that; <span class= "case-law"><u> "Although the word "Dissolution" is not in the section 7 (1) of the 1999 Constitution, the House of Assembly which has the powers to make laws to regulate the affairs of a local government council, that is, for establishment, structure, composition, etc of such council, can make a law for the Dissolution of an erring local government council and for a bye-election to prevent chaos and disorder. Guaranteeing the system of local government by democratically elected local government councils under the Constitution means that the local government council must be a democratically elected one and it is in order if a local government council is dissolved and a bye election is or..."</u></span>
It is therefore deducible that any Dissolution which is contrary to this is illegal, unconstitutional, null and void.</p>

<p>Furthermore, the issue of autonomy does not go all the way to the end, because the constitution also covertly provides for some degree of Federal and state government interference in Local government Affairs and this is evident under <span class= "case-law"><u>sections 4 (6), 8 (3) and (5), 162 (3) (5) (6) (8) Of the 1999 Constitution of The Federal Republic of Nigeria (as amended)</u></span>, which shall now be examined one after the other;

<h3>LEGISLATIVE POWER OF S/HASS. OVER LOCAL GOVERNMENT AFFAIRS.</h3>
<p>First and foremost,<span class= "case-law">S 4(6)</span> provides that; <span class= "case-law"><u>"The legislative powers of a State of the Federation shall be vested in the House of Assembly of the State."</u></span> The literal implication of the above provision is that the State House of Assembly shall have the power to legislate on matters that concern the state and by extension the local government under it; that is why we have the tenure for local government council legislated upon by the respective state Houses of assembly.</p>

<p>Also, on the issue of Finance, by the provisions of <span class= "case-law">Section 162 subsections 5, 6, 7, and 8</span>; the main sources of the Local Government Revenues are :
<ul>
<li>The Federal Government revenue allocation </li>
<li>Internally generated revenue </li>
<li>Grant from donor agencies</li></ul></p>

<p>The Issue of financial autonomy is inconclusive without taking a cursory glance at the provisions of <span class= "case-law">S162 of The constitution</span>, this section has been the focal point of the struggle for Local government autonomy. For context a combined read of <span class= "case-law">Subsections (2) (3) (5) (6) (8) [6] </u></span>of that section will be relevant to our discourse;<ul>
<li><p> The President, upon the receipt of advice from the Revenue Mobilization Allocation and Fiscal Commission, shall table before the National Assembly proposals for revenue allocation from the Federation Account, and in determining the formula, the National Assembly shall take into account, the allocation principles especially those of population, equality of States, internal revenue generation, land mass, terrain as well as population density<br>
Provided that the principle of derivation shall be constantly reflected in any approved formula as being not less than thirteen percent of the revenue accruing to the Federation Account directly from any natural resources;.</p></li>
<li><p> Any amount standing to the credit of the Federation Account shall be distributed among the Federal and State Governments and the Local Government Councils in each State on such terms and in such manner as may be prescribed by the National Assembly.</p></li>
<li><p>The amount standing to the credit of Local Government Councils in the Federation Account shall also be allocated to the State for the benefit of their Local Government Councils on such terms and in such manner as may be prescribed by the National Assembly.</p></li>
<li><p> Each State shall maintain a special account to be called "State Joint Local Government Account" into which shall be paid all allocations to the Local Government Councils of the State from the Federation Account and from the Government of the State.</p></li>
<li><p> Each State shall pay to Local Government Councils in its area of jurisdiction such proportion of its total revenue on such terms and in such manner as may be prescribed by the National Assembly.</p></li>
<li><p> The amount standing to the credit of Local Government Councils of a State shall be distributed among the Local Government Councils of that State on such terms and in such manner as may be prescribed by the House of Assembly of the State.</p></li></p>

<p>The foregoing thereby sets forth an intricate protocol for the allocation of local government funds, which involves the creation of a <span class= "case-law"><u>"State Joint Local Government Account" under subsection (6)</u> </span>from which it is now distributed to the various local governments in the state in compliance with the directive of the National Assembly.<br>

This position was also strengthened by the court in<span class= "case-law">A. G ABIA STATE V. A. G FEDERATION2006) 16 NWLR (Pt. 1005) 265,</span> where the court held that <span class= "case-law"><u>the National Assembly cannot validly make any law permitting the allocation of funds directly to the local government; rather, they should be sent to states who will in turn send it to the "state joint Local government account</span></u></p>

<p>However, this provision apportioned a lot of irregularities, corruption, and arbitrary withholding of local government funds by state governors as was the case in the imbroglio leading to the decision in the case of <span class= "case-law">A. G., Fed. v. A. G., Abia State (2024) 17 NWLR (Pt. 1966) 1.</span> There seems to be a consensus that one major hindrance to the realization of local government autonomy is economic. By connotation, loyalty lies where the money lies. It is because of this that the epoch-making judgment on local government autonomy was made to ameliorate the hardship of the overbearing influence of state government in local government affairs.</p>

<p>Given the foregoing, the Supreme Court in the recent above case affirmed the autonomy of the local governments in Nigeria and by doing so strengthened their independence. In light of this, the Supreme Court held that;</p>
<blockquote><center><p><span class= "case-law">
By virtue of section 162(3) of the 1999 Constitution, any amount of money standing to the Account of the Federation is to be distributed among the Federal Government, the State Governments and the Local Government Councils in such manner as may be prescribed by an Act of the National Assembly. Thus, for the purpose of distribution of money from the Federation Account, the three tiers of Government are considered as separate or independent beneficiaries. However, when it comes to distribution to the Local Government Councils, it is stipulated in section 162(5) and of the Constitution that the amount standing to the credit of Local Government Councils in the Federation Account shall also be allocated to the States for the benefit of their Local Government Council on such terms and in such manner as may be prescribed by the National Assembly, and that each State shall maintain special account to be called "State Joint Local Government Account" into which shall be paid all allocations to the Local Government Councils of the State from the Federation Account and from the Government of the State. For a practical application, the provisions of the two subsections should be read together, and when so done, they stipulate that the monies due to the Local Government Councils from the Federation Account shall be allocated to the State for the benefit of the Local Government Councils. For the purpose of actualizing that process, each state in the Federation is mandated to set up or maintain a special account called "State Joint Local Government Account". It is intended by those provisions that the money allocated to each Local Government in the State in accordance with section 162(3) of the Constitution shall, instead of allocating same directly to the Local Governments, be allocated to the Local Government through the "State Joint Local Government Account" for onward transfer to the individual Local Government Councils. This is because the money allocated to the Local Government through the said "State Joint Local Government Account" is meant for the benefit of the Local Governments. Those stipulations do not give license to the State Governors to withhold monies allocated to the Local Governments and utilize the same in a way and manner they deem fit.</span></p></center ></blockquote>

<p>In the said case the supreme court further restated the status of the local government as an independent tier of government, and disabused the notion that the local governments were an appendage of the state government to be manipulated at the whims of the Governors.</p>

<h3>LOCAL GOVERNMENT PERSONNELS:</h3>
<p>The Local Government Service Commission is the body responsible for appointing, promoting and disciplining staff of the Local Government (Staffs employed by the local governments).<br>

Dissolution of Local Government councils: Based on recent Supreme Court rulings, it is illegal and unconstitutional for state governments to dissolve democratically elected local government councils or replace them with caretaker committees. Elected local governments must be allowed to serve their full tenure; dissolving them, even for reasons like insecurity or financial mismanagement, violates the 1999 Constitution.</p>

<h3>IMPORTANT CASES ON LOCAL GOVERNMENT ADMINISTRATION:</h3> 

 <p>In <span class= "case-law">Attorney-General of Lagos State v. Attorney-General of the Federation (2004) S.C. 70/2004</span>, the Supreme Court ruled that the President lacks the constitutional power to unilaterally withhold or suspend the statutory allocation due to local government councils, even if the state has created new councils without National Assembly approval.  <br>
Furthermore, in <span class= "case-law">Eze V Governor of Abia</span> the court declared that <u>the act of dissolving local government councils by State Governors and replacing them with <span class= "case-law"> “caretaker committee”</span> is illegal and unconstitutional. It further held that, it is the duty of the Governors instead to ensure the existence of Local Government Councils not destroy it</u>.
